name: PHP 8.6 SQLite gallery timings

on:
  push:
    branches: [verify/php86-sqlite-gallery-20261120]

permissions:
  contents: read

jobs:
  gallery:
    if: github.repository == 'ugoparsi/maho'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 3
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.6'
          extensions: opcache, pdo_sqlite
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
      - name: Prepare toolchain and guarded files
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD~2)" = a1a13f0c6b069785490b09650957d2936df15a75
          test "$(git rev-parse HEAD:composer.lock)" = "$(git rev-parse HEAD~2:composer.lock)"
          test ! -e app/etc/local.xml
          composer install --prefer-dist --no-progress --ignore-platform-req=ext-*
          export PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/gallery-chromium"
          echo "PLAYWRIGHT_BROWSERS_PATH=$PLAYWRIGHT_BROWSERS_PATH" >> "$GITHUB_ENV"
          npm ci
          npx playwright install chromium
          node -e "require('playwright').chromium.launch().then((browser) => browser.close())"
          python3 .github/scripts/gallery-proof-wire.py
          php -r 'exit(PHP_VERSION === "8.6.0" && extension_loaded("pdo_sqlite") ? 0 : 1);'
          php -l lib/Maho/Db/Adapter/Pdo/Sqlite.php
          php -l vendor/doctrine/dbal/src/Driver/PDO/PDOConnect.php
      - name: Obtain the pinned sample data
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gallery-sample.tar.gz"
          url=https://codeload.github.com/MahoCommerce/maho-sample-data/tar.gz/e796677c36ae694cadf156b763b096fd2abb619e
          curl --fail --location --retry 3 --output "$archive" "$url"
          echo "a4f54cd18709a72eefe8221f5ca0327afddf269eae628eb5c970dc9e82071191  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP"
      - name: Measure gallery tests in a loopback-only network namespace
        run: |
          set -euo pipefail
          sudo --preserve-env=PATH,RUNNER_TEMP,PLAYWRIGHT_BROWSERS_PATH unshare --net bash -c '
            set -euo pipefail
            ip link set lo up
            exec runuser -m -u "$1" -- bash .github/scripts/gallery-proof-run.sh
          ' gallery-proof "$(id -un)"
