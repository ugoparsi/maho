name: PHP 8.6 current regressions on server databases

on:
  push:
    branches:
      - verify/php86-current-regressions-20261120

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pest-db:
    if: ${{ github.repository == 'ugoparsi/maho' }}
    name: Regressions (${{ matrix.db_image }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      MAHO_SAMPLE_COMMIT: e796677c36ae694cadf156b763b096fd2abb619e
      MAHO_SAMPLE_SHA256: a4f54cd18709a72eefe8221f5ca0327afddf269eae628eb5c970dc9e82071191
      MAGE_IS_DEVELOPER_MODE: 1
      API_BASE_URL: http://127.0.0.1:8901

    strategy:
      fail-fast: false
      matrix:
        db:
          - mysql-min
          - mysql-latest
          - mariadb-min
          - mariadb-latest
          - pgsql-min
          - pgsql-latest
        include:
          - db: mysql-min
            db_engine: mysql
            db_image: mysql:8.4
            db_user: root
            db_pass: root
            health_cmd: mysqladmin ping
            db_command: --log-bin --gtid-mode=ON --enforce-gtid-consistency=ON
          - db: mysql-latest
            db_engine: mysql
            db_image: mysql:latest
            db_user: root
            db_pass: root
            health_cmd: mysqladmin ping
            db_command: --log-bin --gtid-mode=ON --enforce-gtid-consistency=ON
          - db: mariadb-min
            db_engine: mysql
            db_image: mariadb:10.11
            db_user: root
            db_pass: root
            health_cmd: healthcheck.sh --connect --innodb_initialized
            db_command: --skip-name-resolve
          - db: mariadb-latest
            db_engine: mysql
            db_image: mariadb:latest
            db_user: root
            db_pass: root
            health_cmd: healthcheck.sh --connect --innodb_initialized
            db_command: --skip-name-resolve
          - db: pgsql-min
            db_engine: pgsql
            db_image: postgres:15
            db_user: postgres
            db_pass: postgres
            health_cmd: pg_isready
            db_command: postgres
          - db: pgsql-latest
            db_engine: pgsql
            db_image: postgres:latest
            db_user: postgres
            db_pass: postgres
            health_cmd: pg_isready
            db_command: postgres

    services:
      db:
        image: ${{ matrix.db_image }}
        command: ${{ matrix.db_command }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: maho
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: maho
        ports:
          - ${{ contains(matrix.db_image, 'postgres') && '127.0.0.1:5432:5432' || '127.0.0.1:3306:3306' }}
        options: >-
          --health-cmd="${{ matrix.health_cmd }}"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.6"
          extensions: ${{ matrix.db_engine == 'pgsql' && 'opcache, pdo_pgsql' || 'opcache' }}

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: |
          php -r 'exit(PHP_MAJOR_VERSION === 8 && PHP_MINOR_VERSION === 6 ? 0 : 1);'
          composer install --prefer-dist --no-progress
          composer check-platform-reqs --no-dev

      - name: Wire fixture ownership checks
        env:
          DB_ENGINE: ${{ matrix.db_engine }}
          DB_ID: ${{ job.services.db.id }}
        run: |
          test "$(git rev-parse HEAD^)" = a8bed29785296581c170562b3b10b7a0c08a73fb
          test -z "$(git diff --name-only HEAD^ HEAD -- . ':!.github/workflows/pest.yml' ':!.github/scripts/php86-server-delta.php.source')"
          test ! -e app/etc/local.xml
          test "$(realpath vendor)" = "$GITHUB_WORKSPACE/vendor"
          test "$(git hash-object composer.lock)" = dd48e3d83fc35b4f8e11be89f7a4b8e3bbc3bdc8
          test "$(docker inspect --format '{{.State.Health.Status}}' "$DB_ID")" = healthy
          pdo_file=vendor/doctrine/dbal/src/Driver/PDO/PDOConnect.php
          pdo_before=$(git hash-object "$pdo_file")
          python3 - "$pdo_file" <<'PYCODE'
          from pathlib import Path
          import sys
          f = Path(sys.argv[1])
          source = f.read_text()
          replacements = {
              'if (PHP_VERSION_ID < 80400) {': r'\mahoServerDeltaBeforeOpen($dsn);' + chr(10) + '        if (PHP_VERSION_ID < 80400) {',
              'return new PDO($dsn, $username, $password, $options);': r'return \mahoServerDeltaAfterOpen(new PDO($dsn, $username, $password, $options));',
              'return PDO::connect($dsn, $username, $password, $options);': r'return \mahoServerDeltaAfterOpen(PDO::connect($dsn, $username, $password, $options));',
          }
          for old, new in replacements.items():
              assert source.count(old) == 1, old
              source = source.replace(old, new)
          f.write_text(source)
          for adapter in ('Mysql', 'Pgsql'):
              f = Path(f'lib/Maho/Db/Adapter/Pdo/{adapter}.php')
              source = f.read_text()
              query = source.index('    public function query(')
              connect = source.index('            $this->_connect();', query)
              insert = source.index(chr(10), connect)
              f.write_text(source[:insert] + chr(10) + r'            \mahoServerDeltaBeforeQuery($this, $this->_connection);' + source[insert:])
          for kind in ('Backend', 'Frontend'):
              f = Path(f'tests/Maho{kind}TestCase.php')
              source = f.read_text()
              assert source.count('        Mage::app();') == source.count('        Mage::reset();') == 1
              after_app = rf"        \mahoServerDeltaObserveIdle('{kind.lower()}_ready');"
              before_reset = rf"        \mahoServerDeltaObserveIdle('{kind.lower()}_before_reset');"
              source = source.replace('        Mage::app();', '        Mage::app();' + chr(10) + after_app)
              f.write_text(source.replace('        Mage::reset();', before_reset + chr(10) + '        Mage::reset();'))
          f = Path('tests/Pest.php')
          source = f.read_text()
          old = r'        \Mage::app();' + chr(10) + r"        $config = \Mage::getModel('core/config');" + chr(10)*2 + '        $protocols = '
          assert source.count(old) == 1
          guard = r"        \mahoServerDeltaObserveIdle('api_before_fixtures');"
          source = source.replace(old, old.replace(chr(10), chr(10) + guard + chr(10), 1))
          f.write_text(source)
          PYCODE
          php -l "$pdo_file"
          echo "PDO hook $pdo_before -> $(git hash-object "$pdo_file")"
          git diff -- lib/Maho/Db/Adapter/Pdo tests/MahoBackendTestCase.php tests/MahoFrontendTestCase.php tests/Pest.php
          guard_path="$GITHUB_WORKSPACE/.github/scripts/php86-server-delta.php.source"
          ini_dir="$RUNNER_TEMP/maho-php-ini"
          mkdir "$ini_dir"
          printf 'auto_prepend_file="%s"\n' "$guard_path" > "$ini_dir/99-maho-server-delta.ini"
          if [ "$DB_ENGINE" = pgsql ]; then
            identity=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$DB_ID")
          else
            identity=$(docker inspect -f '{{.Config.Hostname}}' "$DB_ID")
          fi
          test -n "$identity"
          {
            echo "MAHO_SERVER_GUARD=$guard_path"
            echo "PHP_INI_SCAN_DIR=${PHP_INI_SCAN_DIR:-}:$ini_dir"
            echo "MAHO_SERVER_LOG=$RUNNER_TEMP/maho-server-guard.jsonl"
            echo "MAHO_DB_ENGINE=$DB_ENGINE"
            echo "MAHO_DB_CONTAINER_IDENTITY=$identity"
          } >> "$GITHUB_ENV"
          docker exec "$DB_ID" sh -c 'mysql --version 2>/dev/null || psql --version 2>/dev/null || mariadb --version'

      - name: Install Maho
        run: |
          cat > "$RUNNER_TEMP/maho-verify-prepend.php" <<'PHP'
          <?php
          exit(function_exists('mahoServerDeltaBeforeOpen') ? 0 : 1);
          PHP
          php "$RUNNER_TEMP/maho-verify-prepend.php"
          SAMPLE_ARCHIVE="$RUNNER_TEMP/maho-sample-data.tar.gz"
          curl --fail --location --retry 3 --output "$SAMPLE_ARCHIVE" "https://codeload.github.com/MahoCommerce/maho-sample-data/tar.gz/$MAHO_SAMPLE_COMMIT"
          echo "$MAHO_SAMPLE_SHA256  $SAMPLE_ARCHIVE" | sha256sum --check
          tar -xzf "$SAMPLE_ARCHIVE" -C "$RUNNER_TEMP"
          php maho install \
            --license_agreement_accepted yes \
            --locale en_US \
            --timezone Europe/London \
            --default_currency USD \
            --db_host 127.0.0.1 \
            --db_name maho \
            --db_user ${{ matrix.db_user }} \
            --db_pass ${{ matrix.db_pass }} \
            --db_engine ${{ matrix.db_engine }} \
            --url "http://127.0.0.1:8901/" \
            --secure_base_url "http://127.0.0.1:8901/" \
            --use_secure 0 \
            --use_secure_admin 0 \
            --admin_lastname admin \
            --admin_firstname admin \
            --admin_email admin@admin.com \
            --admin_username admin \
            --admin_password asdasdasd123123123 \
            --sample_data "$RUNNER_TEMP/maho-sample-data-$MAHO_SAMPLE_COMMIT"
          php maho index:reindex:all
          php maho cache:flush

      - name: Start loopback server
        run: |
          set -euo pipefail
          php maho config:set apiplatform/oauth2/secret 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef --encrypt --scope default --scope-id 0 --silent
          php maho cache:flush
          cat > "$RUNNER_TEMP/maho-router.php" <<'PHP'
          <?php
          require_once getenv('MAHO_SERVER_GUARD');
          return require getenv('GITHUB_WORKSPACE') . '/tests/router.php';
          PHP
          MAHO_GRAPHQL_INTROSPECTION=1 PHP_CLI_SERVER_WORKERS=8 setsid \
            php -d auto_prepend_file= -d opcache.enable_cli=1 -S 127.0.0.1:8901 \
            -t public "$RUNNER_TEMP/maho-router.php" > "$RUNNER_TEMP/maho-server.log" 2>&1 < /dev/null &
          echo "$!" > "$RUNNER_TEMP/maho-server.pid"
          for _ in $(seq 1 20); do
            if curl -fsS "$API_BASE_URL/" -o /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/maho-server.log"
          exit 1

      - name: Run the changed application paths
        run: |
          set -euo pipefail
          php --version
          for phase in before_open opened first_adapter_query; do
            grep -qF "\"phase\":\"$phase\"" "$MAHO_SERVER_LOG"
          done
          pest_proof() {
            local group="$1"
            shift
            php vendor/bin/pest --colors=never --fail-on-skipped \
              --exclude-group=currency-live --exclude-group=sandbox \
              --log-junit "$RUNNER_TEMP/maho-$group.xml" "$@"
          }
          # Local HTTP and ordinary store operations. The wallet case uses a client double.
          pest_proof api tests/Api/Soap/SoapResponseTest.php tests/Api/V2/Read/HttpCacheTest.php
          pest_proof locale tests/Backend/Integration/Core/Model/App/EmulationTranslatorTest.php
          pest_proof checkout --filter='the one-step checkout auto-save of a payment method|refuses an order with a card method that the one-step checkout saved without its card fields' \
            tests/Frontend/Integration/Checkout/CheckoutStepsParityTest.php tests/Frontend/Integration/Checkout/PlaceOrderParityTest.php
          pest_proof wallet --filter='charges a token of the customer of the order' tests/Backend/Integration/Paypal/VaultAssignDataTest.php
          python3 - <<'PY'
          from pathlib import Path
          import json, os
          from xml.etree import ElementTree
          temp = Path(os.environ['RUNNER_TEMP'])
          for name, expected in {'api': 6, 'locale': 6, 'checkout': 6, 'wallet': 1}.items():
              tree = ElementTree.parse(temp / f'maho-{name}.xml')
              cases = tree.findall('.//testcase')
              assert len(cases) == expected, (name, len(cases), expected)
              assert not any(any(c.find(flag) is not None for flag in ('skipped', 'error', 'failure')) for c in cases), name
              print('MAHO_CASES ' + json.dumps({
                  'group': name, 'tests': len(cases), 'assertions': sum(int(c.attrib.get('assertions', 0)) for c in cases),
                  'cases': [c.attrib['name'] for c in cases],
              }))
          PY
          for phase in api_before_fixtures backend_ready backend_before_reset frontend_ready frontend_before_reset; do
            grep -qF "\"phase\":\"$phase\"" "$MAHO_SERVER_LOG"
          done
          grep -qF '"request_path":"\/api\/v2_soap"' "$MAHO_SERVER_LOG"
          if grep -F 'unserialize(): Error at offset 0 of 0 bytes' "$RUNNER_TEMP/maho-server.log"; then
            exit 1
          fi

      - name: Close the owned store and services
        if: always()
        env:
          DB_ID: ${{ job.services.db.id }}
        run: |
          set -euo pipefail
          if test -s "$RUNNER_TEMP/maho-server.pid"; then
            server_pid=$(cat "$RUNNER_TEMP/maho-server.pid")
            if kill -0 "$server_pid" 2>/dev/null; then
              test "$(ps -o pgid= -p "$server_pid" | tr -d ' ')" = "$server_pid"
              kill -TERM -- "-$server_pid"
            fi
            for _ in $(seq 1 20); do
              if ! ss -ltnH 'sport = :8901' | grep -q .; then
                break
              fi
              sleep 0.2
            done
            test -z "$(ss -ltnH 'sport = :8901')"
          fi
          if test -s "${MAHO_SERVER_LOG:-}"; then
            jq -cs 'group_by(.phase) | map({phase:.[0].phase,count:length})' "$MAHO_SERVER_LOG"
            if grep -q 'MAHO_DELTA_GUARD_REJECTED' "$MAHO_SERVER_LOG"; then
              grep 'MAHO_DELTA_GUARD_REJECTED' "$MAHO_SERVER_LOG"
              exit 1
            fi
          fi
          if test -f app/etc/local.xml; then
            test ! -L app/etc/local.xml
            mv app/etc/local.xml "$RUNNER_TEMP/maho-local-closed.xml"
          fi
          docker stop "$DB_ID"
          test "$(docker inspect --format '{{.State.Running}}' "$DB_ID")" = false
          echo MAHO_REGRESSIONS_CLOSED=1
