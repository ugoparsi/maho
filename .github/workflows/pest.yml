name: PHP 8.6 database writes after the upsert and queue fixes

on:
  push:
    branches:
      - verify/php86-upsert-server-20261120

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pest-db:
    if: ${{ github.repository == 'ugoparsi/maho' }}
    name: Batch writes (${{ matrix.db_image }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      MAGE_IS_DEVELOPER_MODE: 1

    strategy:
      fail-fast: false
      matrix:
        db:
          - mysql-min
          - mysql-latest
          - mariadb-min
          - mariadb-latest
          - pgsql-min
          - pgsql-latest
        include:
          - db: mysql-min
            db_engine: mysql
            db_image: mysql:8.4
            db_user: root
            db_pass: root
            health_cmd: mysqladmin ping
            db_command: --log-bin --gtid-mode=ON --enforce-gtid-consistency=ON
          - db: mysql-latest
            db_engine: mysql
            db_image: mysql:latest
            db_user: root
            db_pass: root
            health_cmd: mysqladmin ping
            db_command: --log-bin --gtid-mode=ON --enforce-gtid-consistency=ON
          - db: mariadb-min
            db_engine: mysql
            db_image: mariadb:10.11
            db_user: root
            db_pass: root
            health_cmd: healthcheck.sh --connect --innodb_initialized
            db_command: --skip-name-resolve
          - db: mariadb-latest
            db_engine: mysql
            db_image: mariadb:latest
            db_user: root
            db_pass: root
            health_cmd: healthcheck.sh --connect --innodb_initialized
            db_command: --skip-name-resolve
          - db: pgsql-min
            db_engine: pgsql
            db_image: postgres:15
            db_user: postgres
            db_pass: postgres
            health_cmd: pg_isready
            db_command: postgres
          - db: pgsql-latest
            db_engine: pgsql
            db_image: postgres:latest
            db_user: postgres
            db_pass: postgres
            health_cmd: pg_isready
            db_command: postgres

    services:
      db:
        image: ${{ matrix.db_image }}
        command: ${{ matrix.db_command }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: maho
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: maho
        ports:
          - ${{ contains(matrix.db_image, 'postgres') && '127.0.0.1:5432:5432' || '127.0.0.1:3306:3306' }}
        options: >-
          --health-cmd="${{ matrix.health_cmd }}"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.6"
          extensions: ${{ matrix.db_engine == 'pgsql' && 'opcache, pdo_pgsql' || 'opcache' }}

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 3

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: |
          php -r 'exit(PHP_MAJOR_VERSION === 8 && PHP_MINOR_VERSION === 6 ? 0 : 1);'
          composer install --prefer-dist --no-progress --ignore-platform-req=ext-*

      - name: Wire fixture ownership checks
        env:
          DB_ENGINE: ${{ matrix.db_engine }}
          DB_ID: ${{ job.services.db.id }}
        run: |
          test "$(git rev-parse HEAD^)" = cfe03cad70af99b78c97d372a07d6286599e32ca
          test -z "$(git diff --name-only HEAD^ HEAD -- . ':!.github/workflows/pest.yml' ':!.github/scripts/php86-server-delta.php.source')"
          test ! -e app/etc/local.xml
          test "$(realpath vendor)" = "$GITHUB_WORKSPACE/vendor"
          test "$(git hash-object composer.lock)" = dd48e3d83fc35b4f8e11be89f7a4b8e3bbc3bdc8
          test "$(docker inspect --format '{{.State.Health.Status}}' "$DB_ID")" = healthy
          pdo_file=vendor/doctrine/dbal/src/Driver/PDO/PDOConnect.php
          pdo_before=$(git hash-object "$pdo_file")
          python3 - "$pdo_file" <<'PYCODE'
          from pathlib import Path
          import sys
          f = Path(sys.argv[1])
          source = f.read_text()
          replacements = {
              'if (PHP_VERSION_ID < 80400) {': r'\mahoServerDeltaBeforeOpen($dsn);' + chr(10) + '        if (PHP_VERSION_ID < 80400) {',
              'return new PDO($dsn, $username, $password, $options);': r'return \mahoServerDeltaAfterOpen(new PDO($dsn, $username, $password, $options));',
              'return PDO::connect($dsn, $username, $password, $options);': r'return \mahoServerDeltaAfterOpen(PDO::connect($dsn, $username, $password, $options));',
          }
          for old, new in replacements.items():
              assert source.count(old) == 1, old
              source = source.replace(old, new)
          f.write_text(source)
          for adapter in ('Mysql', 'Pgsql'):
              f = Path(f'lib/Maho/Db/Adapter/Pdo/{adapter}.php')
              source = f.read_text()
              query = source.index('    public function query(')
              connect = source.index('            $this->_connect();', query)
              insert = source.index(chr(10), connect)
              f.write_text(source[:insert] + chr(10) + r'            \mahoServerDeltaBeforeQuery($this, $this->_connection);' + source[insert:])
          f = Path('tests/MahoBackendTestCase.php')
          source = f.read_text()
          assert source.count('        Mage::app();') == source.count('        Mage::reset();') == 1
          source = source.replace('        Mage::app();', '        Mage::app();' + chr(10) + r"        \mahoServerDeltaObserveIdle('backend_ready');")
          source = source.replace('        Mage::reset();', r"        \mahoServerDeltaObserveIdle('backend_before_reset');" + chr(10) + '        Mage::reset();')
          f.write_text(source)
          f = Path('tests/Backend/Integration/Queue/DbTransportTest.php')
          source = f.read_text()
          marker = '    Mage::app();' + chr(10)*2 + "    $resource = Mage::getResourceSingleton('core/config');"
          assert source.count(marker) == 1
          check = "    " + chr(92) + "mahoServerDeltaObserveIdle('queue_reset_ready');"
          f.write_text(source.replace(marker, marker.replace(chr(10), chr(10) + check + chr(10), 1)))
          PYCODE
          php -l "$pdo_file"
          echo "PDO hook $pdo_before -> $(git hash-object "$pdo_file")"
          git diff -- lib/Maho/Db/Adapter/Pdo tests/MahoBackendTestCase.php tests/Backend/Integration/Queue/DbTransportTest.php
          guard_path="$GITHUB_WORKSPACE/.github/scripts/php86-server-delta.php.source"
          ini_dir="$RUNNER_TEMP/maho-php-ini"
          mkdir "$ini_dir"
          printf 'auto_prepend_file="%s"\n' "$guard_path" > "$ini_dir/99-maho-server-delta.ini"
          if [ "$DB_ENGINE" = pgsql ]; then
            identity=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$DB_ID")
          else
            identity=$(docker inspect -f '{{.Config.Hostname}}' "$DB_ID")
          fi
          test -n "$identity"
          {
            echo "MAHO_SERVER_GUARD=$guard_path"
            echo "PHP_INI_SCAN_DIR=${PHP_INI_SCAN_DIR:-}:$ini_dir"
            echo "MAHO_SERVER_LOG=$RUNNER_TEMP/maho-server-guard.jsonl"
            echo "MAHO_DB_ENGINE=$DB_ENGINE"
            echo "MAHO_DB_CONTAINER_IDENTITY=$identity"
          } >> "$GITHUB_ENV"
          docker exec "$DB_ID" sh -c 'mysql --version 2>/dev/null || psql --version 2>/dev/null || mariadb --version'

      - name: Install Maho
        run: |
          cat > "$RUNNER_TEMP/maho-verify-prepend.php" <<'PHP'
          <?php
          exit(function_exists('mahoServerDeltaBeforeOpen') ? 0 : 1);
          PHP
          php "$RUNNER_TEMP/maho-verify-prepend.php"
          php maho install \
            --license_agreement_accepted yes \
            --locale en_US \
            --timezone Europe/London \
            --default_currency USD \
            --db_host 127.0.0.1 \
            --db_name maho \
            --db_user ${{ matrix.db_user }} \
            --db_pass ${{ matrix.db_pass }} \
            --db_engine ${{ matrix.db_engine }} \
            --url "http://127.0.0.1:8901/" \
            --secure_base_url "http://127.0.0.1:8901/" \
            --use_secure 0 \
            --use_secure_admin 0 \
            --admin_lastname admin \
            --admin_firstname admin \
            --admin_email admin@admin.com \
            --admin_username admin \
            --admin_password test-only-password-86

      - name: Verify batch upserts and queue rollback
        run: |
          set -euo pipefail
          php --version
          php vendor/bin/pest --colors=never --log-junit "$RUNNER_TEMP/upsert-junit.xml" \
            --filter insertOnDuplicate tests/Backend/Integration/Db/Adapter/CustomQueryMethodsTest.php
          php vendor/bin/pest --colors=never --log-junit "$RUNNER_TEMP/queue-junit.xml" \
            --filter 'dispatches within the current transaction after resetting Mage' tests/Backend/Integration/Queue/DbTransportTest.php
          python3 - "$RUNNER_TEMP/upsert-junit.xml" "$RUNNER_TEMP/queue-junit.xml" <<'PYCODE'
          from pathlib import Path
          import sys
          from xml.etree import ElementTree
          for path, expected, label in zip(sys.argv[1:], (11, 1), ('UPDATES', 'QUEUE'), strict=True):
              cases = list(ElementTree.parse(Path(path)).iter('testcase'))
              assert len(cases) == expected, [case.attrib.get('name') for case in cases]
              assert all(not any(case.find(kind) is not None for kind in ('skipped', 'failure', 'error'))
                         for case in cases)
              print(f'{label}_VERIFIED={expected}')
              for case in cases:
                  print(case.attrib['name'])
          PYCODE
          for event in before_open opened first_adapter_query backend_ready backend_before_reset queue_reset_ready; do
            grep -q "\"phase\":\"$event\"" "$MAHO_SERVER_LOG"
          done

      - name: Check cleanup
        if: always()
        env:
          DB_ENGINE: ${{ matrix.db_engine }}
          DB_ID: ${{ job.services.db.id }}
        run: |
          if test -s "$MAHO_SERVER_LOG"; then
            jq -cs 'group_by(.phase) | map({phase:.[0].phase,count:length})' "$MAHO_SERVER_LOG"
            if grep -q 'MAHO_DELTA_GUARD_REJECTED' "$MAHO_SERVER_LOG"; then
              exit 1
            fi
          fi
          sql="SELECT COUNT(*) FROM information_schema.tables WHERE table_name ~ '^test_(source|target|numeric_key|binary)_'"
          if test "$DB_ENGINE" = pgsql; then
            left=$(docker exec "$DB_ID" psql -U postgres -d maho -Atc "$sql")
          else
            sql="SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = DATABASE() AND table_name REGEXP '^test_(source|target|numeric_key|binary)_'"
            left=$(docker exec "$DB_ID" sh -c '
              if command -v mariadb > /dev/null; then
                exec mariadb "$@"
              fi
              exec mysql "$@"
            ' db-client -uroot -proot maho --batch --skip-column-names -e "$sql")
          fi
          test "$left" = 0
          echo 'UPDATES_FIXTURES_REMAINING=0'
          if test -e app/etc/local.xml; then
            rm app/etc/local.xml
          fi
