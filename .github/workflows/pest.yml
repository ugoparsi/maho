name: PHP 8.6 official FrankenPHP nightly image proof

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: github.repository == 'ugoparsi/maho'
    name: Nightly (${{ matrix.architecture }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            architecture: amd64
          - runner: ubuntu-24.04-arm
            architecture: arm64
    steps:
      - name: Checkout the verification script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build with the official PHP 8.6 base and verify the image offline
        env:
          PROOF_ARCH: ${{ matrix.architecture }}
        run: bash .github/scripts/php86-official-frankenphp.sh
